<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reservation | Paradise Haven Resort</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <nav class="navbar">

            <div class="logo">
                Paradise Haven Resort
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="rooms.html">Rooms</a>
                </li>

                <li>
                    <a href="amenities.html">Amenities</a>
                </li>

                <li>
                    <a href="rates.html">Rates</a>
                </li>

                <li>
                    <a href="reservation.html"
                       class="active">Reservation</a>
                </li>

            </ul>

        </nav>

    </header>

    <!-- MAIN CONTENT -->
    <main class="reservation-page">

        <!-- INTRO -->
        <section class="reservation-intro">

            <h1>Make Your Reservation</h1>

            <p>
                Book your stay at Paradise Haven Resort
                and experience comfort, relaxation,
                and unforgettable memories.
            </p>

        </section>

        <!-- RESERVATION FORM -->
        <section class="reservation-section">

            <div class="reservation-container">

                <h2>Reservation Form</h2>

                <form>

                    <!-- FULL NAME -->
                    <label for="fullname">
                        Full Name
                    </label>

                    <input type="text"
                           id="fullname"
                           name="fullname"
                           placeholder="Enter your full name"
                           required>

                    <!-- EMAIL -->
                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           required>

                    <!-- PHONE -->
                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="Enter your phone number"
                           required>

                    <!-- ROOM TYPE -->
                    <label for="room">
                        Room Type
                    </label>

                    <select id="room"
                            name="room"
                            required>

                        <option value="">
                            Select Room
                        </option>

                        <option value="Standard Room">
                            Standard Room
                        </option>

                        <option value="Deluxe Room">
                            Deluxe Room
                        </option>

                        <option value="Family Room">
                            Family Room
                        </option>

                    </select>

                    <!-- CHECK IN -->
                    <label for="checkin">
                        Check-in Date
                    </label>

                    <input type="date"
                           id="checkin"
                           name="checkin"
                           required>

                    <!-- CHECK OUT -->
                    <label for="checkout">
                        Check-out Date
                    </label>

                    <input type="date"
                           id="checkout"
                           name="checkout"
                           required>

                    <!-- GUESTS -->
                    <label for="guests">
                        Number of Guests
                    </label>

                    <select id="guests"
                            name="guests"
                            required>

                        <option value="">
                            Select Guests
                        </option>

                        <option value="1">
                            1 Guest
                        </option>

                        <option value="2">
                            2 Guests
                        </option>

                        <option value="3">
                            3 Guests
                        </option>

                        <option value="4">
                            4 Guests
                        </option>

                        <option value="5">
                            5 Guests
                        </option>

                    </select>

                    <!-- SPECIAL REQUEST -->
                    <label for="message">
                        Special Requests
                    </label>

                    <textarea id="message"
                              name="message"
                              rows="4"
                              placeholder="Enter your special requests">
                    </textarea>

                    <!-- BUTTON -->
                    <button type="submit">
                        Submit Reservation
                    </button>

                </form>

            </div>

        </section>

    </main>

</body>

</html>
